name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Ensure Gradle Wrapper exists & fix line endings
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Generate temporary keystore for signing
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=OmniInstaller, OU=Dev, O=Hikaproj, L=Kobe, S=Hyogo, C=JP"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          ./gradlew assembleRelease -x lintVitalRelease --stacktrace

      - name: Rename Release APK
        run: |
          VERSION_TAG="1.0.${{ github.run_number }}"
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "app/build/outputs/apk/release/hikaproj-ominiinstaller-v${VERSION_TAG}.apk"
              break
            fi
          done

      - name: Clean up temporary keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/hikaproj-ominiinstaller-v*.apk